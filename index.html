<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2563eb"><title>Study Tracker Ver.2.2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:0 0 92px;background:#f4f7fb}.wrap{max-width:820px;margin:auto;padding:15px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{font-size:22px;margin:0}.sub,.muted{color:#667085;font-size:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card,.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px #1e293b0d}.card b{display:block;font-size:20px;margin-top:5px}.panel{margin-top:13px}.panel h2{font-size:17px;margin:0 0 11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}label{font-size:12px;color:#667085;display:block;margin-bottom:4px}input,textarea,select{width:100%;padding:11px;border:1px solid #d6deea;border-radius:10px;background:#fff;font-size:16px}textarea{min-height:68px;resize:vertical}button{border:0;border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff;width:100%}.secondary{background:#eaf0ff;color:#1e55bd}.danger{background:#fff0f0;color:#b42318}.tabs,.actions{display:flex;gap:7px}.tabs{margin-bottom:11px}.tabs button,.actions button{flex:1}.tabs button{background:#edf1f6;color:#475467}.tabs button.active{background:#dce8ff;color:#1747a6}.records,.materials{display:flex;flex-direction:column;gap:8px}.record,.material{padding:11px;background:#f7f9fc;border-radius:11px;display:grid;grid-template-columns:1fr auto;gap:8px}.record strong,.material strong{display:block}.record small,.material small{color:#667085}.progress{height:10px;border-radius:99px;background:#e8edf5;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#6648e8);border-radius:99px}.bars{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:24px}.barw{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.bar{width:67%;background:#4f7df3;border-radius:5px 5px 2px 2px;min-height:2px;position:relative}.bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:#667085;white-space:nowrap}.barw small{font-size:9px;color:#667085;margin-top:4px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:#667085;padding:4px}.day{aspect-ratio:1;border-radius:9px;background:#f7f9fc;padding:5px;font-size:11px;position:relative;min-width:0}.day.dim{opacity:.25}.day.today{outline:2px solid #2563eb}.day .m{position:absolute;bottom:4px;left:4px;right:4px;text-align:center;background:#dce8ff;color:#1747a6;border-radius:5px;font-size:9px;padding:2px;overflow:hidden}.report{white-space:pre-wrap;background:#f7f9fc;padding:12px;border-radius:10px;min-height:120px;font-size:14px}.hidden{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #e4e8ef;padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.bottom>div{max-width:820px;margin:auto;display:flex;gap:5px}.bottom button{flex:1;background:#f0f3f8;color:#475467;padding:10px 4px;font-size:12px}.bottom button.active{background:#2563eb;color:#fff}.kpi{display:flex;align-items:center;gap:10px}.flame{font-size:28px}.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.monthnav button{background:#edf2fa}.empty{color:#667085;padding:8px 0}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}@media(max-width:620px){.grid3,.row,.split{grid-template-columns:1fr}.card{padding:12px}.head h1{font-size:20px}.bottom button{font-size:11px}}
</style></head><body><main class="wrap"><div class="head"><div><h1>Study Tracker <span class="sub">Ver.2.2</span></h1><div class="sub">学習を記録して、継続を見える化</div></div><button class="secondary" onclick="showPage('add')">＋ 記録</button></div>
<section id="home"><div class="grid3"><div class="card"><span class="muted">今日</span><b id="todayTotal">0分</b></div><div class="card"><span class="muted">今週</span><b id="weekTotal">0分</b></div><div class="card"><span class="muted">連続学習</span><b id="streak">0日</b></div></div><div class="panel"><div class="kpi"><div class="flame">🎯</div><div style="flex:1"><strong>今週の目標</strong><div><b id="goalNow">0分</b> / <span id="goalTarget">0分</span></div><div class="progress"><div id="goalBar" style="width:0%"></div></div></div></div></div><div class="split"><div><div class="panel"><h2>今週の学習時間</h2><div class="bars" id="weekBars"></div></div><div class="panel"><h2>最近の学習記録</h2><div class="records" id="recent"></div></div></div><div><div class="panel"><h2>教材別学習時間（今月）</h2><div class="bars" id="materialBars"></div></div><div class="panel"><h2>目標設定</h2><div class="field"><label>1週間の目標時間（分）</label><input type="number" min="1" id="goalInput" inputmode="numeric"></div><button class="primary" onclick="saveGoal()">目標を保存</button></div></div></div></section>
<section id="add" class="hidden"><div class="panel"><h2>学習を記録</h2><div class="field"><label>教材</label><select id="materialSelect"></select></div><div class="field"><label>学習内容</label><textarea id="content" placeholder="例：Unit 1〜3、100語"></textarea></div><div class="row"><div class="field"><label>学習日</label><input type="date" id="date"></div><div class="field"><label>学習時間（分）</label><input type="number" min="1" id="minutes" inputmode="numeric" placeholder="60"></div></div><div class="field"><label>メモ（任意）</label><textarea id="memo" placeholder="気づき、次にやること"></textarea></div><button class="primary" onclick="saveRecord()">保存</button></div></section>
<section id="materials" class="hidden"><div class="panel"><h2>教材管理</h2><div class="row"><div class="field"><label>教材名</label><input id="newMaterial" placeholder="例：TOEIC公式問題集"></div><div class="field"><label>カテゴリー</label><input id="newCategory" placeholder="例：英語"></div></div><div class="field"><label>色</label><input type="color" id="newColor" value="#4f7df3"></div><button class="primary" onclick="addMaterial()">教材を追加</button></div><div class="panel"><h2>登録済み教材</h2><div class="materials" id="materialList"></div></div><div class="panel"><h2>バックアップ・復元</h2><p class="sub">学習記録・教材・週間目標をJSONファイルとして保存／復元できます。</p><div class="actions"><button class="secondary" onclick="downloadBackup()">バックアップ</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">復元</button></div><input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(event)"><div id="backupMsg" class="sub" style="margin-top:8px"></div></div></section>
<section id="history" class="hidden"><div class="panel"><h2>学習履歴</h2><div class="tabs"><button id="dayBtn" onclick="setRange('day')">日</button><button id="weekBtn" class="active" onclick="setRange('week')">週</button><button id="monthBtn" onclick="setRange('month')">月</button></div><div class="field"><label>基準日</label><input type="date" id="filterDate" onchange="renderHistory()"></div><p><b id="rangeLabel"></b><br><span class="muted">合計：</span><b id="historyTotal"></b></p><div class="records" id="historyList"></div></div></section>
<section id="calendarPage" class="hidden"><div class="panel"><div class="monthnav"><button onclick="moveMonth(-1)">‹ 前月</button><h2 id="calendarTitle" style="margin:0"></h2><button onclick="moveMonth(1)">翌月 ›</button></div><div class="calendar" id="calendar"></div></div></section>
<section id="report" class="hidden"><div class="panel"><h2>報告用テキスト</h2><div class="tabs"><button id="reportDayBtn" class="active" onclick="setReportRange('day')">1日</button><button id="reportWeekBtn" onclick="setReportRange('week')">1週間</button></div><div class="field"><label>基準日</label><input type="date" id="reportDate" onchange="renderReport()"></div><div class="report" id="reportText"></div><div class="actions" style="margin-top:10px"><button class="primary" onclick="copyReport()">報告内容をコピー</button><button id="aiCopyBtn" class="secondary hidden" onclick="copyAIPrompt()">AI用にコピー</button></div><div class="sub" id="copyMsg" style="margin-top:8px"></div></div></section></main>
<nav class="bottom"><div><button id="navHome" class="active" onclick="showPage('home')">ホーム</button><button id="navAdd" onclick="showPage('add')">記録</button><button id="navMaterials" onclick="showPage('materials')">教材</button><button id="navHistory" onclick="showPage('history')">履歴</button><button id="navCalendarPage" onclick="showPage('calendarPage')">カレンダー</button><button id="navReport" onclick="showPage('report')">報告</button></div></nav>
<script>
const RK='studyTracker.records.v1',MK='studyTracker.materials.v2',GK='studyTracker.goal.v2';let records=safe(RK,[]),materials=safe(MK,[]),goal=Number(localStorage.getItem(GK)||420),range='week',reportRange='day',calDate=new Date();if(!materials.length){let names=[...new Set(records.map(r=>r.material).filter(Boolean))];materials=names.map((name,i)=>({id:Date.now()+i,name,category:'',color:['#4f7df3','#8b5cf6','#10b981','#f59e0b'][i%4]}));if(!materials.length)materials=[{id:Date.now(),name:'英単語',category:'英語',color:'#4f7df3'}];saveMaterials()}
function safe(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function saveMaterials(){localStorage.setItem(MK,JSON.stringify(materials))}const iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},today=iso(new Date());['date','filterDate','reportDate'].forEach(id=>document.getElementById(id).value=today);document.getElementById('goalInput').value=goal;
function fmt(m){m=Number(m)||0;let h=Math.floor(m/60),r=m%60;return h?(r?`${h}時間${r}分`:`${h}時間`):`${r}分`}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sum(a){return a.reduce((n,r)=>n+Number(r.minutes||0),0)}function monday(s){let d=new Date(s+'T00:00:00'),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}function monthStart(s){let d=new Date(s+'T00:00:00');return new Date(d.getFullYear(),d.getMonth(),1)}function monthEnd(s){let d=new Date(s+'T00:00:00');return new Date(d.getFullYear(),d.getMonth()+1,0)}function inSpan(r,a,b){let d=new Date(r.date+'T00:00:00');return d>=a&&d<=b}function span(base,type){let a,b=new Date(base+'T00:00:00');if(type==='day')a=new Date(b);else if(type==='week'){a=monday(base);b=new Date(a);b.setDate(b.getDate()+6)}else{a=monthStart(base);b=monthEnd(base)}return[a,b]}
function showPage(id){['home','add','materials','history','calendarPage','report'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==id);document.getElementById('nav'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===id)});if(id==='home')renderHome();if(id==='add')renderMaterialSelect();if(id==='materials')renderMaterials();if(id==='history')renderHistory();if(id==='calendarPage')renderCalendar();if(id==='report')renderReport()}
function renderMaterialSelect(){let s=document.getElementById('materialSelect');s.innerHTML=materials.map(m=>`<option value="${m.id}">${esc(m.name)}${m.category?'（'+esc(m.category)+'）':''}</option>`).join('')}
function addMaterial(){let name=document.getElementById('newMaterial').value.trim(),category=document.getElementById('newCategory').value.trim(),color=document.getElementById('newColor').value;if(!name)return alert('教材名を入力してください。');if(materials.some(m=>m.name===name))return alert('同じ教材名が登録されています。');materials.push({id:Date.now(),name,category,color});saveMaterials();document.getElementById('newMaterial').value='';document.getElementById('newCategory').value='';renderMaterials();renderMaterialSelect()}
function deleteMaterial(id){let m=materials.find(x=>x.id===id);if(records.some(r=>r.materialId===id||r.material===m.name))return alert('学習記録で使用中の教材は削除できません。');if(confirm('この教材を削除しますか？')){materials=materials.filter(x=>x.id!==id);saveMaterials();renderMaterials()}}
function renderMaterials(){document.getElementById('materialList').innerHTML=materials.map(m=>{let total=sum(records.filter(r=>r.materialId===m.id||r.material===m.name));return `<div class="material" style="border-left:5px solid ${m.color}"><div><strong>${esc(m.name)}</strong><small>${esc(m.category||'カテゴリーなし')}｜累計 ${fmt(total)}</small></div><button class="danger" onclick="deleteMaterial(${m.id})">削除</button></div>`}).join('')||'<div class="empty">教材がありません。</div>'}
function saveRecord(){let id=Number(document.getElementById('materialSelect').value),m=materials.find(x=>x.id===id),content=document.getElementById('content').value.trim(),date=document.getElementById('date').value,minutes=parseInt(document.getElementById('minutes').value,10),memo=document.getElementById('memo').value.trim();if(!m||!content||!date||!minutes||minutes<1)return alert('教材、学習内容、学習日、学習時間を入力してください。');records.unshift({id:Date.now(),materialId:m.id,material:m.name,content,date,minutes,memo});localStorage.setItem(RK,JSON.stringify(records));['content','minutes','memo'].forEach(x=>document.getElementById(x).value='');showPage('home')}
function delRecord(id){if(confirm('この記録を削除しますか？')){records=records.filter(r=>r.id!==id);localStorage.setItem(RK,JSON.stringify(records));renderHome();renderHistory()}}
function recHtml(r,canDelete=false){let m=materials.find(x=>x.id===r.materialId)||materials.find(x=>x.name===r.material),color=m?.color||'#4f7df3';return `<div class="record" style="border-left:4px solid ${color}"><div><strong>${esc(r.material)} · ${fmt(r.minutes)}</strong><small>${esc(r.date)}｜${esc(r.content)}${r.memo?'｜'+esc(r.memo):''}</small></div>${canDelete?`<button class="danger" onclick="delRecord(${r.id})">削除</button>`:''}</div>`}
function calcStreak(){let days=new Set(records.filter(r=>Number(r.minutes)>0).map(r=>r.date)),d=new Date(today+'T00:00:00');if(!days.has(today)){d.setDate(d.getDate()-1);if(!days.has(iso(d)))return 0}let n=0;while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function bars(el,data,labelFn){let max=Math.max(60,...data.map(x=>x.value));document.getElementById(el).innerHTML=data.map(x=>`<div class="barw"><div class="bar" style="height:${Math.max(2,x.value/max*105)}px;background:${x.color||'#4f7df3'}"><span>${x.value?fmt(x.value):''}</span></div><small>${esc(labelFn(x))}</small></div>`).join('')}
function renderHome(){let [wa,wb]=span(today,'week'),[ma,mb]=span(today,'month'),weekRec=records.filter(r=>inSpan(r,wa,wb)),monthRec=records.filter(r=>inSpan(r,ma,mb)),wt=sum(weekRec);document.getElementById('todayTotal').textContent=fmt(sum(records.filter(r=>r.date===today)));document.getElementById('weekTotal').textContent=fmt(wt);document.getElementById('streak').textContent=calcStreak()+'日';document.getElementById('goalNow').textContent=fmt(wt);document.getElementById('goalTarget').textContent=fmt(goal);document.getElementById('goalBar').style.width=Math.min(100,wt/Math.max(1,goal)*100)+'%';document.getElementById('recent').innerHTML=records.slice(0,5).map(r=>recHtml(r)).join('')||'<div class="empty">まだ記録がありません。</div>';let week=[0,1,2,3,4,5,6].map((n,i)=>{let d=new Date(wa);d.setDate(d.getDate()+n);return{label:['月','火','水','木','金','土','日'][i],value:sum(records.filter(r=>r.date===iso(d)))}});bars('weekBars',week,x=>x.label);let by=materials.map(m=>({label:m.name,value:sum(monthRec.filter(r=>r.materialId===m.id||r.material===m.name)),color:m.color})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,6);if(!by.length)by=[{label:'記録なし',value:0,color:'#cbd5e1'}];bars('materialBars',by,x=>x.label)}
function saveGoal(){let n=parseInt(document.getElementById('goalInput').value,10);if(!n||n<1)return alert('1分以上で入力してください。');goal=n;localStorage.setItem(GK,String(goal));renderHome();alert('週間目標を保存しました。')}
function setRange(x){range=x;['day','week','month'].forEach(y=>document.getElementById(y+'Btn').classList.toggle('active',y===x));renderHistory()}function renderHistory(){let base=document.getElementById('filterDate').value||today,[a,b]=span(base,range),rs=records.filter(r=>inSpan(r,a,b)).sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('rangeLabel').textContent=range==='day'?iso(a):`${iso(a)} ～ ${iso(b)}`;document.getElementById('historyTotal').textContent=fmt(sum(rs));document.getElementById('historyList').innerHTML=rs.map(r=>recHtml(r,true)).join('')||'<div class="empty">この期間の記録はありません。</div>'}
function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=new Date(first),offset=(first.getDay()+6)%7;start.setDate(start.getDate()-offset);document.getElementById('calendarTitle').textContent=`${y}年 ${m+1}月`;let html=['月','火','水','木','金','土','日'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(d.getDate()+i);let ds=iso(d),v=sum(records.filter(r=>r.date===ds));html+=`<div class="day ${d.getMonth()!==m?'dim':''} ${ds===today?'today':''}"><span>${d.getDate()}</span>${v?`<div class="m">${fmt(v)}</div>`:''}</div>`}document.getElementById('calendar').innerHTML=html}
function jpDate(s){let [y,m,d]=s.split('-').map(Number);return `${y}/${m}/${d}`}function studyDayNumber(base){let days=[...new Set(records.filter(r=>Number(r.minutes)>0&&r.date<=base).map(r=>r.date))].sort();let i=days.indexOf(base);return i>=0?i+1:days.filter(d=>d<=base).length}function uniqueLines(items){return [...new Set(items.map(x=>String(x||'').trim()).filter(Boolean))]}function buildWeeklyAIPrompt(a,b,groups){let text=`以下は${jpDate(iso(a))}〜${jpDate(iso(b))}の週間学習記録です。各教材について、入力された「学習内容」と「メモ・気づき」だけを根拠に、重複を統合して日本語で簡潔に要約してください。推測や未記録の成果は追加しないでください。教材ごとに「できるようになったこと」「課題」「来週意識すること」の3項目でまとめてください。情報が不足する項目は「記録なし」としてください。\n`;for(let [name,list] of Object.entries(groups)){text+=`\n■ ${name}\n学習内容：\n${uniqueLines(list.map(r=>r.content)).map(x=>'・'+x).join('\n')||'・記録なし'}\nメモ・気づき：\n${uniqueLines(list.map(r=>r.memo)).map(x=>'・'+x).join('\n')||'・記録なし'}\n`}return text}let currentAIPrompt='';
function setReportRange(x){reportRange=x;document.getElementById('reportDayBtn').classList.toggle('active',x==='day');document.getElementById('reportWeekBtn').classList.toggle('active',x==='week');renderReport()}function renderReport(){let base=document.getElementById('reportDate').value||today,[a,b]=span(base,reportRange),rs=records.filter(r=>inSpan(r,a,b)).sort((x,y)=>x.date.localeCompare(y.date)),groups={};rs.forEach(r=>(groups[r.material]??=[]).push(r));let txt='';if(reportRange==='day'){let day=iso(a),dayNo=studyDayNumber(day);txt=`【Day ${dayNo}｜${jpDate(day)}】\n合計：${fmt(sum(rs))}\n`;for(let [name,list] of Object.entries(groups)){txt+=`\n■ ${name}：${fmt(sum(list))}\n`;list.forEach(r=>{txt+=`・${r.content}（${fmt(r.minutes)}）\n`;if(r.memo)txt+=`  気づき：${r.memo}\n`})}currentAIPrompt='';}else{let studyDays=new Set(rs.map(r=>r.date)).size;txt=`【週間学習レポート｜${jpDate(iso(a))}〜${jpDate(iso(b))}】\n合計学習時間：${fmt(sum(rs))}\n学習日数：${studyDays}日\n`;for(let [name,list] of Object.entries(groups)){txt+=`\n■ ${name}\n学習時間：${fmt(sum(list))}\n学習内容：\n`;uniqueLines(list.map(r=>r.content)).forEach(x=>txt+=`・${x}\n`);let memos=uniqueLines(list.map(r=>r.memo));txt+=`【日々の気づき】\n${memos.length?memos.map(x=>'・'+x).join('\n'):'・記録なし'}\n`}currentAIPrompt=buildWeeklyAIPrompt(a,b,groups);}if(!rs.length)txt+='\n学習記録はありません。';document.getElementById('reportText').textContent=txt;document.getElementById('copyMsg').textContent='';document.getElementById('aiCopyBtn').classList.toggle('hidden',reportRange!=='week')}async function writeClipboard(t,msg){try{await navigator.clipboard.writeText(t)}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}document.getElementById('copyMsg').textContent=msg}function copyReport(){writeClipboard(document.getElementById('reportText').textContent,'報告内容をコピーしました。')}function copyAIPrompt(){if(!currentAIPrompt)return;writeClipboard(currentAIPrompt,'AI用プロンプトをコピーしました。CopilotやChatGPTに貼り付けてください。')}
function backupPayload(){return{format:'study-tracker-backup',version:'2.2',exportedAt:new Date().toISOString(),records,materials,goal}}function downloadBackup(){let blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`study-tracker-backup-${today}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);document.getElementById('backupMsg').textContent='バックアップを保存しました。'}async function restoreBackup(ev){let f=ev.target.files&&ev.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.records))throw Error('records');let incoming=d.records.map((r,i)=>({id:Number(r.id)||Date.now()+i,materialId:r.materialId?Number(r.materialId):undefined,material:String(r.material||'').trim(),content:String(r.content??'-'),date:String(r.date||''),minutes:Number(r.minutes)||0,memo:String(r.memo||'')})).filter(r=>r.material&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&r.minutes>0);if(!incoming.length)throw Error('empty');let incomingMaterials=Array.isArray(d.materials)?d.materials:[];let byName=new Map(materials.map(m=>[m.name,m]));incomingMaterials.forEach((m,i)=>{let name=String(m.name||'').trim();if(name&&!byName.has(name)){let nm={id:Number(m.id)||Date.now()+1000+i,name,category:String(m.category||''),color:String(m.color||'#4f7df3')};materials.push(nm);byName.set(name,nm)}});incoming.forEach(r=>{if(!byName.has(r.material)){let nm={id:Date.now()+2000+materials.length,name:r.material,category:'',color:'#4f7df3'};materials.push(nm);byName.set(r.material,nm)}r.materialId=byName.get(r.material).id});let existing=new Set(records.map(r=>[r.date,r.material,r.content,r.minutes,r.memo].join('|')));let added=0;incoming.forEach(r=>{let k=[r.date,r.material,r.content,r.minutes,r.memo].join('|');if(!existing.has(k)){records.push(r);existing.add(k);added++}});records.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);if(Number(d.goal)>0)goal=Number(d.goal);localStorage.setItem(RK,JSON.stringify(records));saveMaterials();localStorage.setItem(GK,String(goal));document.getElementById('goalInput').value=goal;renderMaterialSelect();renderMaterials();renderHome();renderHistory();renderCalendar();renderReport();document.getElementById('backupMsg').textContent=`復元完了：${added}件追加しました。`;alert(`復元完了：${added}件の学習記録を追加しました。`)}catch(e){alert('復元できませんでした。Study TrackerのバックアップJSONを選択してください。')}finally{ev.target.value=''}}
renderMaterialSelect();renderHome();renderHistory();renderCalendar();renderReport();
</script></body></html>
