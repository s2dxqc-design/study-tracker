<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>My English Words V2.2</title><style>
:root{color-scheme:light dark;--bg:#f3f6fb;--card:#fff;--text:#172033;--sub:#667085;--line:#d8dfeb;--blue:#2563eb;--soft:#eef4ff}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172135;--text:#f8fafc;--sub:#a7b2c4;--line:#334155;--soft:#1e293b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:650px;margin:auto;padding:16px}.title{font-size:21px;font-weight:850}.summary,.note,.msg{font-size:13px;color:var(--sub)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tab,.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px;border-radius:12px;font-weight:750}.tab.active{background:var(--blue);color:white}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.word{text-align:center;font-size:34px;font-weight:850;margin-top:18px}.speak{display:block;margin:13px auto;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:10px 17px}.meaning{background:var(--bg);border-radius:15px;min-height:66px;padding:19px;text-align:center;font-size:21px}.primary,.answer{width:100%;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:800}.primary{margin-top:15px;background:var(--blue);color:white}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.bad{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.hidden{display:none!important}.tools{display:grid;gap:9px;margin-top:13px}.file{text-align:center;border:1px dashed var(--blue);color:var(--blue);border-radius:13px;padding:13px;font-weight:750}.file input{display:none}.msg{text-align:center;min-height:20px;margin-top:8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:var(--soft);padding:12px 5px;border-radius:14px;text-align:center}.metric b{display:block;font-size:18px}.rows>div{display:grid;grid-template-columns:1.3fr .8fr .8fr .8fr;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.weakRows>div{display:grid;grid-template-columns:1.5fr .7fr .7fr;border-top:1px solid var(--line);padding:10px 0;font-size:13px}
</style></head><body><main class="app"><div class="title">My English Words V2.2</div><div id="summary" class="summary">0語</div><nav class="tabs"><button class="tab active" data-p="study">通常学習</button><button class="tab" data-p="weak">苦手だけ</button><button class="tab" data-p="history">履歴</button></nav>
<section id="study" class="panel active"><div class="card"><div id="empty" class="note">CSVを読み込んでください。</div><div id="quiz" class="hidden"><div class="note"><span id="mode">通常学習</span> ｜ <span id="timer">今日 00:00</span></div><div class="word" id="word"></div><button id="speak" class="speak">🔊 発音</button><div class="meaning"><span id="mask" class="note">意味を考えてください</span><span id="meaning" class="hidden"></span></div><button id="reveal" class="primary">答えを見る</button><div id="answers" class="answers hidden"><button id="bad" class="answer bad">分からない</button><button id="good" class="answer good">分かった</button></div></div></div></section>
<section id="weak" class="panel"><div class="card"><div id="weakInfo" class="note">苦手単語はありません。</div><button id="startWeak" class="primary hidden">苦手だけ復習を始める</button><p class="note">一度「分からない」にした単語が対象。3回連続正解で卒業します。</p></div></section>
<section id="history" class="panel"><div class="metrics"><div class="metric"><b id="todayN">0</b><span>今日の問題</span></div><div class="metric"><b id="todayA">0%</b><span>正答率</span></div><div class="metric"><b id="todayT">0分</b><span>学習時間</span></div></div><div class="card" style="margin-top:14px"><h3>日ごとの履歴</h3><div id="days" class="rows"></div><h3>苦手単語</h3><div id="weakList" class="weakRows"></div></div></section>
<div class="tools"><label class="file">CSVを読み込む<input id="csv" type="file" accept=".csv,text/csv,.txt"></label><button id="reset" class="secondary">学習履歴をリセット</button></div><div id="msg" class="msg" aria-live="polite"></div></main>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),K='myEnglishWords.v2';let S={words:[],daily:{}},cur=null,studyMode='normal',last=Date.now();const key=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function day(){let k=key();return S.daily[k]||(S.daily[k]={ok:0,ng:0,seconds:0})}function save(){localStorage.setItem(K,JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem(K)||'null');if(x)S=x}catch(e){}S.words=Array.isArray(S.words)?S.words:[];S.daily=S.daily||{};S.words.forEach(w=>{w.ok=Number(w.ok)||0;w.ng=Number(w.ng)||0;w.streak=Number(w.streak)||0;w.weak=!!w.weak});render();if(S.words.length)next()}
function splitCSV(text){text=String(text??'').replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(field);field=''}else if(c==='\n'&&!quote){row.push(field);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(v=>v.trim()!==''))rows.push(row);return rows}function norm(x){return String(x??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[ _-]/g,'')}function parse(text){let r=splitCSV(text);if(!r.length)throw Error('CSVが空です');let h=r[0].map(norm),wn=['english','word','英単語','単語','英語'],mn=['japanese','meaning','日本語','意味','和訳','訳'];let wi=h.findIndex(x=>wn.includes(x)),mi=h.findIndex(x=>mn.includes(x));if(wi<0||mi<0)throw Error(`列名を認識できません。1行目: ${r[0].join(' | ')}`);let out=r.slice(1).filter(x=>String(x[wi]??'').trim()&&String(x[mi]??'').trim()).map(x=>({word:String(x[wi]).trim(),meaning:String(x[mi]).trim(),ok:0,ng:0,streak:0,weak:false}));if(!out.length)throw Error('単語データが0件です');return out}
function pool(){let a=studyMode==='weak'?S.words.filter(w=>w.weak):S.words;if(studyMode==='weak')return a;let p=[];a.forEach(w=>{let n=Math.max(1,Math.min(9,1+w.ng*2-Math.min(w.ok,3)));while(n--)p.push(w)});return p}function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===id))}function next(){let p=pool();if(!p.length){cur=null;show(studyMode==='weak'?'weak':'study');render();return}cur=p[Math.floor(Math.random()*p.length)];$('word').textContent=cur.word;$('meaning').textContent=cur.meaning;$('meaning').classList.add('hidden');$('mask').classList.remove('hidden');$('reveal').classList.remove('hidden');$('answers').classList.add('hidden');$('mode').textContent=studyMode==='weak'?'苦手だけ復習':'通常学習';show('study');render()}function answer(ok){if(!cur)return;let d=day();if(ok){cur.ok++;cur.streak++;d.ok=(Number(d.ok)||0)+1;if(cur.weak&&cur.streak>=3)cur.weak=false}else{cur.ng++;cur.streak=0;cur.weak=true;d.ng=(Number(d.ng)||0)+1}save();next()}function fmt(s){return s<60?`${Math.floor(s)}秒`:`${Math.round(s/60)}分`}function esc(x){let d=document.createElement('div');d.textContent=x;return d.innerHTML}
function render(){let total=S.words.reduce((a,w)=>a+w.ok+w.ng,0),ok=S.words.reduce((a,w)=>a+w.ok,0),weak=S.words.filter(w=>w.weak),d=day(),n=(Number(d.ok)||0)+(Number(d.ng)||0);$('summary').textContent=`${S.words.length}語 ｜ 累計${total}問 ｜ 正答率${total?Math.round(ok/total*100):0}% ｜ 苦手${weak.length}語`;$('empty').classList.toggle('hidden',S.words.length>0);$('quiz').classList.toggle('hidden',!S.words.length||!cur);$('weakInfo').textContent=weak.length?`苦手単語 ${weak.length}語`:'苦手単語はありません。';$('startWeak').classList.toggle('hidden',!weak.length);$('todayN').textContent=n;$('todayA').textContent=(n?Math.round((Number(d.ok)||0)/n*100):0)+'%';$('todayT').textContent=fmt(Number(d.seconds)||0);$('timer').textContent='今日 '+String(Math.floor((d.seconds||0)/60)).padStart(2,'0')+':'+String(Math.floor((d.seconds||0)%60)).padStart(2,'0');$('days').innerHTML=Object.keys(S.daily).sort().reverse().map(k=>{let x=S.daily[k],q=(x.ok||0)+(x.ng||0);return `<div><span>${k}</span><span>${q}問</span><span>${q?Math.round((x.ok||0)/q*100):0}%</span><span>${fmt(x.seconds||0)}</span></div>`}).join('')||'<p class="note">履歴なし</p>';$('weakList').innerHTML=weak.sort((a,b)=>b.ng-a.ng).map(w=>`<div><span>${esc(w.word)}</span><span>${w.ng}回</span><span>${w.streak}/3</span></div>`).join('')||'<p class="note">苦手単語なし</p>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{let p=b.dataset.p;if(p==='study'){studyMode='normal';next()}else{show(p);render()}});$('startWeak').onclick=()=>{studyMode='weak';next()};$('reveal').onclick=()=>{$('meaning').classList.remove('hidden');$('mask').classList.add('hidden');$('reveal').classList.add('hidden');$('answers').classList.remove('hidden')};$('good').onclick=()=>answer(true);$('bad').onclick=()=>answer(false);$('speak').onclick=()=>{if(!cur)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.word);u.lang='en-US';u.rate=.82;u.volume=1;speechSynthesis.speak(u)}catch(e){$('msg').textContent='音声を開始できませんでした。'}};$('csv').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onerror=()=>{$('msg').textContent='ファイルを開けませんでした。'};r.onload=()=>{try{let nw=parse(r.result),old=new Map(S.words.map(w=>[w.word.toLowerCase(),w]));S.words=nw.map(w=>{let x=old.get(w.word.toLowerCase());return x?{...w,ok:x.ok||0,ng:x.ng||0,streak:x.streak||0,weak:!!x.weak}:w});save();studyMode='normal';$('msg').textContent=`読込成功：${S.words.length}語`;next()}catch(err){$('msg').textContent='読込エラー：'+err.message}};r.readAsText(f,'UTF-8');e.target.value=''};$('reset').onclick=()=>{if(confirm('履歴と時間をリセットしますか？')){S.words.forEach(w=>Object.assign(w,{ok:0,ng:0,streak:0,weak:false}));S.daily={};save();next()}};setInterval(()=>{let now=Date.now(),dt=Math.min(2,Math.max(0,(now-last)/1000));last=now;if(document.visibilityState==='visible'&&document.querySelector('#study.active')&&cur){day().seconds=(Number(day().seconds)||0)+dt;render();if(Math.floor(day().seconds)%10===0)save()}},1000);document.addEventListener('visibilitychange',()=>{last=Date.now();save()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load()})();
</script></body></html>
